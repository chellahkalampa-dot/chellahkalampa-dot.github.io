
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Web Lab</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #17243a;
        }

        main {
            padding: 70px 20px;
        }

        h1 {
            color: #38bdf8;
            font-size: 42px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        button {
            padding: 14px 25px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <h2>KALI WEB LAB</h2>
    </header>

    <main>
        <h1>Welcome to My Website</h1>

        <p>
            My first website, built using Kali Linux.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </main>

    <footer>
        Learning HTML, CSS, JavaScript and Web Hosting.
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Congratulations! Your website is working.";
        }
    </script>

</body>
</html>
